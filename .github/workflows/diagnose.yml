name: Diagnose
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 20 -H "X-API-Key: jobboerse-jobsuche" "https://rest.arbeitsagentur.de/jobboerse/jobsuche-service/pc/v6/jobs?was=Junior%20Consultant&wo=75417%20M%C3%BChlacker&umkreis=50&angebotsart=1&veroeffentlichtseit=14&size=2&page=1" > /tmp/b
          echo "==KEYS"; jq -c 'keys' /tmp/b
          echo "==BODY"; jq -c 'del(.facetten)' /tmp/b | head -c 3000; echo
